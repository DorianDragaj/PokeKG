# Triplestore + Python runtime for the Pokémon Knowledge Graph.
#   make up     -> start Fuseki,  http://localhost:3030  (user: admin, pass: admin)
#   make down   -> stop, keeping the data
#   make reset  -> stop and delete the database volume
services:
  fuseki:
    image: secoresearch/fuseki:latest      # Apache Jena Fuseki 6.2 (TDB2)
    # No container_name on purpose: a fixed name collides with any other
    # checkout of this repo on the same machine. Compose derives one from the
    # project directory instead.
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_PASSWORD:-admin}
    volumes:
      # Our dataset definition replaces the image's demo dataset.
      - ./fuseki/dataset-config.ttl:/fuseki-base/configuration/assembler.ttl:ro
      # TDB2 files live in a named volume so `docker compose down` keeps the KG.
      - fuseki-data:/fuseki-base/databases
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3030/$$/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # Every pipeline step runs here, one container per `make` target. Behind a
  # profile so `docker compose up` starts the triplestore only; the Makefile
  # reaches this service with `docker compose run --rm app ...`.
  app:
    build: .
    image: pokekg-app
    profiles: ["cli"]
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      # Container-to-container, so the service name rather than localhost.
      FUSEKI_HOST: http://fuseki:3030
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      HOME: /home/app
    volumes:
      # The repository itself, so edits are live and generated artefacts
      # (data/rdf, embeddings/models, results) land in the working tree.
      - .:/app
      # PyKEEN and Matplotlib caches, kept out of the working tree.
      - app-home:/home/app
    ports:
      - "8000:8000"                        # make serve
    working_dir: /app

volumes:
  fuseki-data:
  app-home:
